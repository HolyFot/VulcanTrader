<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>VulcanTrader - Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1b1b1b 0%, #14131b 50%, #0d0b16 100%);
            min-height: 100vh;
            color: #e8e5ef;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .login-card {
            background: linear-gradient(135deg, #1b1b1b 0%, #14131b 50%, #0d0b16 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            max-width: 420px;
            width: 100%;
            overflow: hidden;
            animation: slideIn 0.4s ease-out;
        }
        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .login-header {
            background: linear-gradient(110deg, #4c1d95 0%, #8b7cf6 45%, #7fb2f7 100%);
            padding: 2rem 1.5rem;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* Wordmark styling lives in theme.css (.login-header h1) so the login
           page matches the nav brand: Cinzel, white->grey gradient, drop
           shadow. Only the layout-ish bits stay here; a `color` here would
           fight the gradient's transparent fill. */
        .login-header h1 {
            font-size: 1.75rem;
        }
        .login-header p {
            margin-top: 0.5rem;
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.9rem;
        }
        .login-body { padding: 2rem 1.5rem; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #e8e5ef;
            font-size: 0.875rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .form-input {
            width: 100%;
            padding: 0.85rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #e8e5ef;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        .form-input:focus {
            outline: none;
            border-color: #8b7cf6;
            box-shadow: 0 0 0 3px rgba(139,124,246, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }
        .btn-login {
            width: 100%;
            padding: 0.9rem;
            margin-top: 0.5rem;
            background: linear-gradient(135deg, #4c17ad 0%, #341664 50%, #190538 100%);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-login:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139,124,246, 0.4);
        }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
        .login-error {
            background: linear-gradient(135deg, rgba(185, 28, 28, 0.2), rgba(127, 29, 29, 0.2));
            border: 1px solid rgba(244,135,155, 0.3);
            border-radius: 6px;
            padding: 0.75rem;
            margin-bottom: 1rem;
            color: #fca5a5;
            font-size: 0.875rem;
        }
        .login-footer {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
            font-size: 0.8rem;
            color: #9891a8;
        }
        .login-footer a { color: #8b7cf6; text-decoration: none; }
        .login-footer a:hover { text-decoration: underline; }
        .spinner-small {
            display: inline-block;
            width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,0.25);
            border-left-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 0.5rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/theme.css?v=45">
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h1>VulcanTrader <span id="version" style="font-size:0.55em; opacity:0.7; font-weight:400;">v1.3</span></h1>
        </div>
        <div class="login-body">
            <div id="error" class="login-error" style="display:none;"></div>
            <form id="login-form" autocomplete="off">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input id="username" name="username" type="text" class="form-input" value="admin" autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" class="form-input" required autocomplete="current-password">
                </div>
                <button type="submit" id="submit-btn" class="btn-login">Login</button>
            </form>
            <div class="login-footer">
                <a href="/trading">Trading</a> &nbsp;·&nbsp;
                <a href="/backtester">Backtester</a> &nbsp;·&nbsp;
                <a href="/datamanager">Data Manager</a>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const errBox = document.getElementById('error');
        const btn = document.getElementById('submit-btn');

        // No auth needed for this one (see /api/version in web_portal.py) -
        // static "v1.3" markup above stays put if the fetch fails.
        fetch('/api/version')
            .then(r => r.json())
            .then(d => { if (d.version) document.getElementById('version').textContent = 'v' + d.version; })
            .catch(() => {});

        // Auto-redirect if already authenticated
        if (localStorage.getItem('VulcanTrader_token')) {
            window.location.href = '/trading';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errBox.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-small"></span>Signing in...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value,
                    }),
                });
                if (!res.ok) {
                    const j = await res.json().catch(() => ({}));
                    throw new Error(j.detail || `HTTP ${res.status}`);
                }
                const data = await res.json();
                localStorage.setItem('VulcanTrader_token', data.token);
                window.location.href = '/trading';
            } catch (err) {
                errBox.textContent = err.message || 'Login failed';
                errBox.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Login';
            }
        });
    </script>
</body>
</html>
